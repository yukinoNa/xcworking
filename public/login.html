<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录 · 宣传部工作台</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<header class="topbar">
  <a class="brand" href="/"><span class="brand-mark">宣</span><span class="brand-text">宣传部工作台</span></a>
  <nav>
    <a href="/">工作排期</a>
    <a href="/order.html">约稿 / 合作</a>
    <a href="/login.html" class="active">内部看板</a>
  </nav>
</header>

<main class="wrap" style="max-width:400px;padding-top:11vh">
  <form class="card" id="form" style="animation:pop .4s var(--ease) both">
    <h1 style="font-size:22px;margin:0 0 6px;letter-spacing:-.02em">登录内部看板</h1>
    <p class="sub" style="margin-bottom:24px">用部门分配给你的账号登录</p>

    <div class="err" id="err"></div>

    <div class="field">
      <label for="username">用户名</label>
      <input type="text" id="username" autocomplete="username" required maxlength="24" autofocus>
    </div>

    <div class="field">
      <label for="password">密码</label>
      <input type="password" id="password" autocomplete="current-password" required>
    </div>

    <button class="btn accent" type="submit" id="submit" style="width:100%;justify-content:center;margin-top:4px">登录</button>

    <p class="sub" style="margin-top:18px;font-size:12.5px;text-align:center">忘记密码请联系管理员重置</p>
  </form>
</main>

<script>
const $ = (id) => document.getElementById(id);

$("form").onsubmit = async (e) => {
  e.preventDefault();
  $("err").style.display = "none";
  const btn = $("submit");
  btn.disabled = true;
  btn.textContent = "登录中…";
  try {
    const r = await fetch("/api/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: $("username").value.trim(), password: $("password").value }),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || "登录失败");
    location.href = "/admin.html";
  } catch (ex) {
    $("err").textContent = ex.message;
    $("err").style.display = "block";
    btn.disabled = false;
    btn.textContent = "登录";
  }
};

fetch("/api/auth/me").then((r) => { if (r.ok) location.href = "/admin.html"; }).catch(() => {});
</script>
</body>
</html>
